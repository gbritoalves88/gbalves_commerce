<!-- features/perfil/perfil.component.html -->
<section class="perfil-page">
  <div class="container">
    <h1>Meu Perfil</h1>

    <div class="perfil-layout">
      <aside class="perfil-sidebar">
        <div class="user-avatar">
          <mat-icon>person</mat-icon>
        </div>
        <h3>{{ usuario.nome }}</h3>
        <p>{{ usuario.email }}</p>

        <nav class="perfil-nav">
          <a routerLink="/perfil" class="nav-item" [class.active]="activeTab === 'info'">
            <mat-icon>person_outline</mat-icon>
            Dados Pessoais
          </a>
          <a routerLink="/perfil/pedidos" class="nav-item">
            <mat-icon>receipt_long</mat-icon>
            Meus Pedidos
          </a>
        </nav>
      </aside>

      <div class="perfil-content">
        <div class="content-card">
          <h2>Dados Pessoais</h2>

          <form (ngSubmit)="salvarPerfil()">
            <mat-form-field appearance="outline">
              <mat-label>Nome completo</mat-label>
              <input matInput [(ngModel)]="usuario.nome" name="nome">
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" [(ngModel)]="usuario.email" name="email">
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Telefone</mat-label>
              <input matInput [(ngModel)]="usuario.telefone" name="telefone">
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>CPF</mat-label>
              <input matInput [(ngModel)]="usuario.cpf" name="cpf">
            </mat-form-field>

            <button mat-flat-button class="save-btn" type="submit" [disabled]="salvando">
              <mat-icon>save</mat-icon>
              {{ salvando ? 'Salvando...' : 'Salvar Alterações' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
