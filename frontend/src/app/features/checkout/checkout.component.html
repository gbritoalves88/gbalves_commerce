<!-- features/checkout/checkout.component.html (trecho do formulário) -->
<div class="form-section">
  <h2>👤 Dados Pessoais</h2>

  <mat-form-field appearance="outline">
    <mat-label>Nome completo</mat-label>
    <input matInput [(ngModel)]="cliente.nome" name="nome" required>
  </mat-form-field>

  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="cliente.email" name="email" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefone</mat-label>
      <input matInput [(ngModel)]="cliente.telefone" name="telefone" required>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>CPF</mat-label>
    <input matInput [(ngModel)]="cliente.cpf" name="cpf">
  </mat-form-field>
</div>

<div class="form-section">
  <h2>📍 Endereço de Entrega</h2>

  <div class="form-row cep-row">
    <mat-form-field appearance="outline" class="cep-field">
      <mat-label>CEP</mat-label>
      <input matInput [(ngModel)]="cliente.cep" name="cep" maxlength="8" (blur)="buscarCep()" required>
    </mat-form-field>
    <button type="button" mat-stroked-button (click)="buscarCep()">Buscar</button>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="street-field">
      <mat-label>Rua</mat-label>
      <input matInput [(ngModel)]="cliente.rua" name="rua" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="number-field">
      <mat-label>Número</mat-label>
      <input matInput [(ngModel)]="cliente.numero" name="numero" required>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Complemento</mat-label>
    <input matInput [(ngModel)]="cliente.complemento" name="complemento">
  </mat-form-field>

  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>Bairro</mat-label>
      <input matInput [(ngModel)]="cliente.bairro" name="bairro" required>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Cidade</mat-label>
      <input matInput [(ngModel)]="cliente.cidade" name="cidade" required>
    </mat-form-field>
    <mat-form-field appearance="outline" class="state-field">
      <mat-label>UF</mat-label>
      <input matInput [(ngModel)]="cliente.estado" name="estado" maxlength="2" required>
    </mat-form-field>
  </div>
</div>

<div class="form-section">
  <h2>💳 Forma de Pagamento</h2>
  <mat-radio-group [(ngModel)]="cliente.formaPagamento" name="formaPagamento" class="payment-options">
    <mat-radio-button value="pix">
      <mat-icon>pix</mat-icon> Pix
    </mat-radio-button>
    <mat-radio-button value="cartao_credito">
      <mat-icon>credit_card</mat-icon> Cartão de Crédito
    </mat-radio-button>
  </mat-radio-group>
</div>

<button mat-fab extended class="finish-btn" (click)="finalizarPedido()" [disabled]="loading">
  <mat-icon>lock</mat-icon>
  {{ loading ? 'Processando...' : 'Finalizar Pedido - R$ ' + total.toFixed(2) }}
</button>
