<!-- features/admin/categorias/categorias.component.html -->
<div class="categories-admin">
  <div class="page-header">
    <div>
      <h1>Categorias</h1>
      <p>{{ categories().length }} categorias cadastradas</p>
    </div>
    <button mat-fab extended routerLink="/admin/categorias/new">
      <mat-icon>add</mat-icon>
      Nova Categoria
    </button>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="categories()">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let categoria">{{ categoria.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>Slug</th>
        <td mat-cell *matCellDef="let categoria">
          <code>{{ categoria.slug }}</code>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let categoria">
          <button mat-icon-button [routerLink]="['/admin/categorias/edit', categoria.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteCategoria(categoria.id, categoria.nome)">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
