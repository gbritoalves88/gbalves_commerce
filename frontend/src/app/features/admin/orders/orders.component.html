<!-- features/admin/orders/orders.component.html -->
<div class="orders-admin">
  <div class="page-header">
    <div>
      <h1>Pedidos</h1>
      <p>{{ orders().length }} pedidos</p>
    </div>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="orders()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Pedido</th>
        <td mat-cell *matCellDef="let order">
          <strong>#{{ order.id }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let order">{{ order.customer.name }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let order">R$ {{ order.total.toFixed(2) }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let order">
          <span class="status-badge" [style.background]="getStatusColor(order.status)">
            {{ getStatusLabel(order.status) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let order">{{ order.date | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let order">
          <button mat-icon-button [routerLink]="['/admin/orders', order.id]">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
