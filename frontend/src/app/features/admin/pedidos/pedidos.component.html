<!-- features/admin/pedidos/pedidos.component.html -->
<div class="pedidos-admin">
  <div class="page-header">
    <div>
      <h1>Pedidos</h1>
      <p>{{ pedidos().length }} pedidos</p>
    </div>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="pedidos()">
      <ng-container matColumnDef="numeroPedido">
        <th mat-header-cell *matHeaderCellDef>Pedido</th>
        <td mat-cell *matCellDef="let p">
          <strong>#{{ p.numeroPedido }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="clienteNome">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let p">{{ p.clienteNome }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let p">R$ {{ p.total.toFixed(2) }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let p">
          <span class="status-badge" [style.background]="getStatusColor(p.status)">
            {{ getStatusLabel(p.status) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="criadoEm">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let p">{{ p.criadoEm | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button [routerLink]="['/admin/pedidos', p.id]">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
