<!-- features/admin/products/products.component.html -->
<div class="products-admin">
  <div class="page-header">
    <div>
      <h1>Produtos</h1>
      <p>{{ products().length }} produtos cadastrados</p>
    </div>
    <button mat-fab extended routerLink="/admin/products/new">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="products()">
      <!-- Imagem -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Imagem</th>
        <td mat-cell *matCellDef="let product">
          <img [src]="product.image" [alt]="product.name" class="product-thumb">
        </td>
      </ng-container>

      <!-- Nome -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>

      <!-- Preço -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Preço</th>
        <td mat-cell *matCellDef="let product">R$ {{ product.price.toFixed(2) }}</td>
      </ng-container>

      <!-- Estoque -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Estoque</th>
        <td mat-cell *matCellDef="let product">
          <span [class.low-stock]="product.stock <= 10">
            {{ product.stock }}
          </span>
        </td>
      </ng-container>

      <!-- Categoria -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let product">{{ product.category }}</td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button [routerLink]="['/admin/products/edit', product.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteProduct(product.id, product.name)">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
