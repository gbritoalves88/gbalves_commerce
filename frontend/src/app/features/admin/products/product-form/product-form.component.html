<!-- features/admin/products/product-form/product-form.component.html -->
<div class="product-form">
  <div class="page-header">
    <div>
      <a routerLink="/admin/products" class="back-link">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </a>
      <h1>{{ isEdit ? 'Editar Produto' : 'Novo Produto' }}</h1>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="form-card">
    <div class="form-row">
      <mat-form-field appearance="outline" class="flex-2">
        <mat-label>Nome do Produto</mat-label>
        <input matInput [(ngModel)]="product.name" name="name"
               (blur)="generateSlug()" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Categoria</mat-label>
        <mat-select [(ngModel)]="product.category" name="category" required>
          @for (cat of categories; track cat.id) {
            <mat-option [value]="cat.slug">{{ cat.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Slug</mat-label>
      <input matInput [(ngModel)]="product.slug" name="slug" required>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Preço (R$)</mat-label>
        <input matInput type="number" [(ngModel)]="product.price" name="price"
               min="0" step="0.01" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Preço Original (opcional)</mat-label>
        <input matInput type="number" [(ngModel)]="product.originalPrice"
               name="originalPrice" min="0" step="0.01">
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Estoque</mat-label>
        <input matInput type="number" [(ngModel)]="product.stock" name="stock"
               min="0" required>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>URL da Imagem</mat-label>
      <input matInput [(ngModel)]="product.image" name="image" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <textarea matInput [(ngModel)]="product.description" name="description"
                rows="3"></textarea>
    </mat-form-field>

    <mat-slide-toggle [(ngModel)]="product.featured" name="featured">
      Destaque na Home
    </mat-slide-toggle>

    <div class="form-actions">
      <button mat-stroked-button type="button" routerLink="/admin/products">
        Cancelar
      </button>
      <button mat-flat-button type="submit" class="save-btn">
        <mat-icon>save</mat-icon>
        {{ isEdit ? 'Atualizar' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</div>
