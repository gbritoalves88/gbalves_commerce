<!-- features/admin/categories/category-form/category-form.component.html -->
<div class="category-form">
  <div class="page-header">
    <div>
      <a routerLink="/admin/categories" class="back-link">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </a>
      <h1>{{ isEdit ? 'Editar Categoria' : 'Nova Categoria' }}</h1>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="form-card">
    <mat-form-field appearance="outline">
      <mat-label>Nome da Categoria</mat-label>
      <input matInput [(ngModel)]="category.name" name="name" 
             (blur)="generateSlug()" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Slug</mat-label>
      <input matInput [(ngModel)]="category.slug" name="slug" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>URL da Imagem (opcional)</mat-label>
      <input matInput [(ngModel)]="category.image" name="image">
    </mat-form-field>

    <div class="form-actions">
      <button mat-stroked-button type="button" routerLink="/admin/categories">
        Cancelar
      </button>
      <button mat-flat-button type="submit" class="save-btn">
        <mat-icon>save</mat-icon>
        {{ isEdit ? 'Atualizar' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</div>
