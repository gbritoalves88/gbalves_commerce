<!-- features/admin/admin-layout/admin-layout.component.html -->
<div class="admin-layout">
  <button class="hamburger" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  @if (menuAberto) {
    <div class="overlay" (click)="fecharMenu()"></div>
  }

  <aside class="sidebar" [class.open]="menuAberto">
    <div class="sidebar-header">
      <mat-icon>storefront</mat-icon>
      <span>Admin</span>
    </div>

    <nav class="sidebar-nav">
      <!-- Menu Operador (todos veem) -->
      @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="fecharMenu()">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }

      <!-- Menu Admin (só admin vê) -->
      @if (isAdmin) {
        <div class="sidebar-divider"></div>
        @for (item of adminMenuItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="fecharMenu()">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item">
        <mat-icon>store</mat-icon>
        <span>Ver Loja</span>
      </a>
      <button class="nav-item logout-btn" (click)="authService.logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
