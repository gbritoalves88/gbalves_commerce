<!-- features/home/home.component.html -->
<section class="home">
  <!-- Banner Carrossel -->
  <div class="banner-carousel">
    <div class="swiper banner-swiper">
      <div class="swiper-wrapper">
        @for (banner of banners(); track banner.id) {
          <div class="swiper-slide">
            <div class="banner-slide" [style.background-image]="'url(' + banner.imagemUrl + ')'">
              <div class="banner-overlay">
                <div class="banner-content">
                  <h1>{{ banner.titulo }}</h1>
                  <p>{{ banner.subtitulo }}</p>
                    <a (click)="navegar(banner.link || '/produtos')" class="banner-btn">
                      {{ banner.textoBotao || 'Ver mais' }}
                    </a>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <!-- Produtos em Destaque -->
  <section class="featured-produtos">
    <div class="container">
      <div class="section-header">
        <h2>Produtos em Destaque</h2>
        <a routerLink="/produtos" class="view-all">
          Ver todos <mat-icon>arrow_forward</mat-icon>
        </a>
      </div>

      <div class="produtos-grid">
        @for (produto of featuredProducts(); track produto.id) {
          <app-produto-card [product]="produto"></app-produto-card>
        }
      </div>
    </div>
  </section>
</section>
